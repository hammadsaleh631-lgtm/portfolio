<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Saleh Hammad — Flutter Developer Monogram">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.7" />
      <stop offset="50%" stop-color="#00d2b8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="flutterCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="flutterTeal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2b8" />
      <stop offset="100%" stop-color="#0ea5e9" />
    </linearGradient>
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="16" fill="url(#bgGrad)" />
  <rect x="1.5" y="1.5" width="61" height="61" rx="16" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Iconic Flutter Geometric Wings forming modern code symbol -->
  <!-- Top Flutter Wing -->
  <path d="M16 16 L38 38 L48 28 L26 6 Z" fill="url(#flutterCyan)" opacity="0.95" />
  
  <!-- Middle Dynamic Chevron Fold -->
  <path d="M28 38 L38 48 L48 48 L33 33 Z" fill="url(#flutterTeal)" />

  <!-- Lower Flutter Forward Arrow -->
  <path d="M22 44 L32 54 L44 54 L29 39 Z" fill="url(#flutterCyan)" opacity="0.85" />

  <!-- Distinctive Intersecting S-H Core Accent -->
  <path d="M38 38 L48 28 L38 18 L28 28 Z" fill="url(#whiteGrad)" opacity="0.9" filter="url(#softGlow)" />
</svg>
